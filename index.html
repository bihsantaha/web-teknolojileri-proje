<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilişim Sistemleri Projesi</title>
  
  <!-- CSS'i buraya linkledim, öbür türlü tasarımsız bomboş beyaz sayfa çıkıyor -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hocanın derste üstüne basa basa anlattığı semantik yapı, her şeyi main içine aldım -->
  <main>
    <article>
      <h2>Hoş Geldiniz</h2>
      <p>Bura projenin ana içeriği olacak</p>
    </article>

    <!-- 3. Hafta iletişim formu. Hoca en az 5 farklı denetim istemişti, required falan ne varsa doldurdum -->
    <section id="iletisim">
      <h2>Bize Ulaşın</h2>
      <form action="#" method="post">
        
        <div>
          <label for="ad">Adınız Soyadınız (Zorunlu):</label>
          <input type="text" id="ad" name="ad" required autocomplete="name">
        </div>

        <div>
          <label for="eposta">E-posta Adresiniz (Zorunlu):</label>
          <!-- email type verdim ki yanlış mail girince css'teki kırmızı border yansın -->
          <input type="email" id="eposta" name="eposta" required autocomplete="email">
        </div>

        <div>
          <label for="telefon">Telefon Numaranız:</label>
          <input type="tel" id="telefon" name="telefon" autocomplete="tel">
        </div>

        <div>
          <label for="mesaj">Mesajınız (En az 10 karakter):</label>
          <textarea id="mesaj" name="mesaj" rows="4" required minlength="10"></textarea>
        </div>

        <!-- CSS'teki şekilli butonu buraya çekmek için class verdim, yoksa aşırı leş duruyordu -->
        <button type="submit" class="btn-gonder">Mesajı Gönder</button>
      </form>
    </section>

    <!-- Hocanın istediği duyarlı görsel kısmı. Resim mobilde tam sayfa patlamasın diye srcset ve lazy loading ekledim, puan kırılmaz inş -->
    <section id="galeri">
      <h2>Görseller</h2>
      <img src="kampus-800.jpg" 
           alt="Kampüs görünümü" 
           srcset="kampus-400.jpg 400w, kampus-800.jpg 800w"
           sizes="(max-width: 600px) 100vw, 50vw" 
           width="800" height="533" 
           loading="lazy">
    </section>
  </main> 

</body>
</html>
